name: Verify staging candidate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate:portable
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-structure.mjs
      - run: npm run build
      - run: docker build --target runtime -t zappy:staging-candidate .
      - run: npm run test:container
# No deployment or registry push: production access and complete product are still pending.
